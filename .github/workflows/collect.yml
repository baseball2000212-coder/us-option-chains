name: collect cboe options

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "am / pm / eod"
        required: true
        default: "am"
        type: choice
        options: [am, pm, eod]
  # 외부 크론(cron-job.org)이 정시에 workflow_dispatch로 깨우고, 아래 예약은 백업 (놓친 회차는 스크립트가 건너뜀)
  schedule:
    - cron: "0 13 * * 1-5"     # am (EDT 9:00 / EST 8:00)
    - cron: "0 17 * * 1-5"     # pm (EDT 13:00 / EST 12:00)
    - cron: "30 22,23 * * 1-5" # eod

permissions:
  contents: read

# 외부 크론과 백업 예약이 겹치면 하나는 대기 → 뒤에 도는 잡은 시각이 다 지나 아무것도 안 하고 끝남
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: decide mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 13 * * 1-5") echo "mode=am"  >> $GITHUB_OUTPUT ;;
              "0 17 * * 1-5") echo "mode=pm"  >> $GITHUB_OUTPUT ;;
              *)              echo "mode=eod" >> $GITHUB_OUTPUT ;;
            esac
          fi

      # 수집 결과는 비공개 데이터 저장소에 저장 (이 공개 저장소에는 코드만)
      - run: python collect_cboe.py ${{ steps.m.outputs.mode }}
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO }}
